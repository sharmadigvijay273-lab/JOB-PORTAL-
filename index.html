<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>One Job Portal - India Exclusive</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
          colors: {
            glass: 'rgba(15, 23, 42, 0.7)',
            primary: '#f97316', /* Orange/Saffron for India theme */
            secondary: '#10b981', /* Green */
            accent: '#3b82f6', 
            darkbg: '#020617' 
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out forwards',
            'blob': 'blob 7s infinite',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            blob: { '0%': { transform: 'translate(0px, 0px) scale(1)' }, '33%': { transform: 'translate(30px, -50px) scale(1.1)' }, '66%': { transform: 'translate(-20px, 20px) scale(0.9)' }, '100%': { transform: 'translate(0px, 0px) scale(1)' } }
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #020617; color: #f8fafc; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    .bg-shape { position: fixed; filter: blur(100px); z-index: -1; opacity: 0.3; }
    .shape-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: rgba(249, 115, 22, 0.3); animation: blob 7s infinite; }
    .shape-2 { top: 40%; right: -10%; width: 40vw; height: 40vw; background: rgba(16, 185, 129, 0.2); animation: blob 7s infinite 2s; }
    .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    @media (min-width: 1024px) { .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; } }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    .text-gradient { background: linear-gradient(to right, #f97316, #10b981, #f97316); background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text; animation: shine 3s linear infinite; }
    @keyframes shine { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">
  
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <!-- Navigation -->
  <nav class="glass-panel sticky top-0 z-[40] border-b border-white/5 shadow-2xl">
    <div class="max-w-[90rem] mx-auto px-4 lg:px-8 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2 sm:gap-3 cursor-pointer">
        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center shadow-lg relative overflow-hidden group">
          <i class="fa-solid fa-layer-group text-white text-lg sm:text-xl z-10 group-hover:scale-110 transition-transform"></i>
        </div>
        <div class="flex flex-col">
          <h1 class="flex items-baseline gap-1 sm:gap-1.5 leading-none">
            <span class="text-2xl sm:text-3xl font-black text-gradient tracking-tighter">ONE</span>
            <span class="text-base sm:text-xl font-light tracking-[0.15em] text-white">JOB</span>
          </h1>
          <span class="text-[8px] sm:text-[9px] text-slate-400 font-bold uppercase tracking-[0.2em] sm:tracking-[0.3em] mt-0.5">India Region Only</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <img src="https://ui-avatars.com/api/?name=IN&background=f97316&color=fff" class="w-8 h-8 rounded-full border-2 border-primary/50" alt="Profile">
      </div>
    </div>
  </nav>

  <main class="flex-grow max-w-[90rem] mx-auto w-full px-3 sm:px-6 lg:px-8 pt-4 pb-12 relative">
    
    <!-- Search Dashboard -->
    <div class="glass-panel rounded-2xl p-4 sm:p-6 relative overflow-hidden shadow-2xl mb-6 border-t-4 border-t-primary">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-3 sm:gap-4 items-end">
        <div class="md:col-span-4 relative">
          <label class="text-[9px] sm:text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 block">Job Title / Keyword</label>
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-[32px] sm:top-[34px] text-slate-500"></i>
          <input type="text" id="searchQuery" value="Data Scientist" class="w-full bg-slate-900/50 border border-white/10 rounded-xl pl-11 pr-4 py-2.5 sm:py-3 text-sm sm:text-base text-white focus:ring-2 focus:ring-primary outline-none transition">
        </div>
        
        <div class="md:col-span-3 relative">
          <label class="text-[9px] sm:text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 block">Location (India)</label>
          <i class="fa-solid fa-location-dot absolute left-4 top-[32px] sm:top-[34px] text-slate-500"></i>
          <select id="searchLocation" class="w-full bg-slate-900/50 border border-white/10 rounded-xl pl-11 pr-4 py-2.5 sm:py-3 text-sm sm:text-base text-white focus:ring-2 focus:ring-primary outline-none appearance-none">
            <option value="Pan India">Pan India / Remote</option>
            <option value="Bengaluru">Bengaluru, Karnataka</option>
            <option value="Gurugram">Gurugram, Haryana</option>
            <option value="Hyderabad">Hyderabad, Telangana</option>
            <option value="Pune">Pune, Maharashtra</option>
            <option value="Mumbai">Mumbai, Maharashtra</option>
            <option value="Chennai">Chennai, Tamil Nadu</option>
            <option value="Noida">Noida, UP</option>
          </select>
        </div>

        <div class="md:col-span-3 relative">
          <label class="text-[9px] sm:text-[10px] font-bold text-primary uppercase tracking-widest mb-1.5 block">My Skills</label>
          <input type="text" id="userSkills" value="Python, SQL, Machine Learning" class="w-full bg-primary/10 border border-primary/30 rounded-xl px-4 py-2.5 sm:py-3 text-sm text-white focus:ring-2 focus:ring-primary outline-none">
        </div>

        <div class="md:col-span-2">
          <button onclick="runGlobalSearch()" class="w-full bg-gradient-to-r from-primary to-secondary hover:opacity-90 text-white font-bold py-3 rounded-xl transition shadow-[0_0_20px_rgba(249,115,22,0.3)]">
            <i class="fa-solid fa-radar text-lg mr-1"></i> Scan
          </button>
        </div>
      </div>
    </div>

    <!-- Results Area -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:h-[calc(100vh-280px)] min-h-[500px]">
      
      <!-- Left: Feed -->
      <div class="lg:col-span-5 flex flex-col glass-panel rounded-2xl overflow-hidden border border-white/10 shadow-xl h-[60vh] lg:h-full">
        <div class="p-3 sm:p-4 border-b border-white/10 bg-slate-900/50 flex justify-between items-center">
          <span class="text-xs sm:text-sm font-bold text-white"><span id="resultCount" class="text-primary">0</span> India Jobs Found</span>
          <select id="sortJobs" onchange="renderFeed()" class="bg-slate-800 border border-slate-700 text-[10px] sm:text-xs text-white rounded-lg px-2 sm:px-3 py-1.5 outline-none cursor-pointer">
            <option value="match">Match %</option>
            <option value="salary">Highest Salary</option>
          </select>
        </div>
        
        <div id="jobFeed" class="flex-1 overflow-y-auto custom-scroll p-2 sm:p-3 space-y-2 sm:space-y-3">
          <div class="h-full flex flex-col items-center justify-center text-slate-500 opacity-50">
            <i class="fa-solid fa-magnifying-glass text-4xl mb-3"></i>
            <p class="text-xs">Awaiting Search Query...</p>
          </div>
        </div>
      </div>

      <!-- Right: Job Details & Scraped Descriptions -->
      <div id="jobDetailContainer" class="hidden lg:flex lg:col-span-7 glass-panel rounded-2xl overflow-hidden flex-col border border-white/10 bg-slate-900/80">
        <div id="jobDetail" class="w-full h-full p-5 sm:p-8 flex flex-col items-center justify-center text-center text-slate-500">
          <i class="fa-solid fa-file-contract text-5xl mb-4 text-slate-600"></i>
          <h3 class="text-xl sm:text-2xl font-bold text-slate-300">Detailed Descriptions</h3>
          <p class="text-xs sm:text-sm max-w-md mt-2">Select an Indian job listing to view the full career portal description, INR salary benchmarks, and requirements.</p>
        </div>
      </div>
      
    </div>
  </main>

  <!-- Mobile Detail Overlay -->
  <div id="mobileOverlay" class="fixed inset-0 bg-slate-950/95 z-50 translate-y-full transition-transform duration-300 lg:hidden flex flex-col">
    <div class="p-4 border-b border-white/10 flex justify-between items-center bg-slate-900 sticky top-0">
      <span class="font-bold text-white text-sm"><i class="fa-solid fa-briefcase text-primary mr-2"></i>Job Details</span>
      <button onclick="document.getElementById('mobileOverlay').classList.add('translate-y-full')" class="w-8 h-8 rounded-full bg-white/10 text-white"><i class="fa-solid fa-chevron-down"></i></button>
    </div>
    <div id="mobileJobDetail" class="flex-1 overflow-y-auto p-4 custom-scroll pb-10"></div>
  </div>

  <script>
    // Indian Focused Portal Registry
    const PortalRegistry = {
      LinkedIn: { icon: 'fa-linkedin text-blue-500', color: 'border-blue-500/30 bg-blue-500/10' },
      Naukri: { icon: 'fa-briefcase text-blue-400', color: 'border-blue-400/30 bg-blue-400/10' },
      Foundit: { icon: 'fa-cube text-purple-500', color: 'border-purple-500/30 bg-purple-500/10' },
      Instahyre: { icon: 'fa-bolt text-yellow-500', color: 'border-yellow-500/30 bg-yellow-500/10' },
      IIMJobs: { icon: 'fa-graduation-cap text-red-500', color: 'border-red-500/30 bg-red-500/10' },
      Company_Career_Page: { icon: 'fa-globe text-emerald-500', color: 'border-emerald-500/30 bg-emerald-500/10' }
    };

    const IN_CITIES = ['Bengaluru, Karnataka', 'Gurugram, Haryana', 'Hyderabad, Telangana', 'Pune, Maharashtra', 'Mumbai, Maharashtra', 'Noida, UP', 'Chennai, Tamil Nadu'];
    const IN_COMPANIES = ['TCS', 'Infosys', 'Wipro', 'Tech Mahindra', 'HCLTech', 'Flipkart', 'Zomato', 'Paytm', 'Reliance Jio', 'Tata Digital', 'Global In-house Center (GIC)'];

    let AppState = { jobs: [], activeJob: null, userSkills: [] };

    // Generate Full Realistic Job Descriptions
    function generateIndianJobDescription(title, company, skills) {
      return `
        <strong class="text-white">About ${company} India:</strong><br/>
        We are a leading technology hub operating out of India, driving digital transformation globally. We are looking for an exceptional ${title} to join our engineering center. 
        <br/><br/>
        <strong class="text-white">Role & Responsibilities:</strong><br/>
        • End-to-end ownership of scalable architecture within the Indian subcontinent and global ecosystems.<br/>
        • Collaborate with cross-functional teams in Bengaluru and US/EU counterparts.<br/>
        • Implement and maintain core logic utilizing ${skills[0]} and ${skills[1] || 'modern tech stacks'}.<br/>
        • Ensure compliance with data localization and security standards.<br/>
        <br/>
        <strong class="text-white">What we are looking for:</strong><br/>
        • Minimum 3-5 years of proven experience in the Indian IT sector or equivalent.<br/>
        • Hands-on expertise in ${skills.join(', ')}.<br/>
        • Strong problem-solving mindset and ability to thrive in a fast-paced environment.<br/>
        <br/>
        <strong class="text-white">Perks & Benefits:</strong><br/>
        • Comprehensive Health Insurance (including family).<br/>
        • Hybrid work model (3 days office, 2 days WFH).<br/>
        • EPF/Gratuity benefits as per Indian labor laws.<br/>
        • Free catered meals and transport facilities.
      `;
    }

    async function runGlobalSearch() {
      const q = document.getElementById('searchQuery').value.trim() || 'Software Engineer';
      let loc = document.getElementById('searchLocation').value;
      if (loc === 'Pan India') loc = IN_CITIES[Math.floor(Math.random() * IN_CITIES.length)];
      
      AppState.userSkills = document.getElementById('userSkills').value.split(',').map(s=>s.trim().toLowerCase()).filter(s=>s);
      
      document.getElementById('jobFeed').innerHTML = `
        <div class="h-full flex flex-col items-center justify-center text-slate-400">
          <i class="fa-solid fa-spinner animate-spin text-3xl text-primary mb-3"></i>
          <p class="text-xs">Scraping Indian Portals...</p>
        </div>`;
      
      AppState.jobs = [];
      const portals = Object.keys(PortalRegistry);
      
      // Simulate Scraping multiple portals
      setTimeout(() => {
        for(let i=0; i<25; i++) {
          const portal = portals[i % portals.length];
          const company = IN_COMPANIES[Math.floor(Math.random() * IN_COMPANIES.length)];
          const city = loc === 'Pan India' ? IN_CITIES[Math.floor(Math.random() * IN_CITIES.length)] : loc;
          
          // Generate INR Salary: Random between 6 LPA and 45 LPA
          const lpa = (Math.random() * 35 + 6).toFixed(1);
          
          const jobSkills = [q.split(' ')[0], 'Agile', 'Cloud', 'System Design', 'Communication'].sort(()=>0.5-Math.random()).slice(0,4);
          
          AppState.jobs.push({
            id: `ind_${Date.now()}_${i}`,
            title: `${['Senior', 'Lead', 'Staff', 'Associate'][i%4]} ${q}`,
            company: company,
            location: i%5===0 ? 'Remote (India)' : city,
            portal: portal,
            lpa: parseFloat(lpa),
            salaryStr: `₹${lpa} LPA - ₹${(parseFloat(lpa) + 5).toFixed(1)} LPA`,
            skills: jobSkills,
            desc: generateIndianJobDescription(q, company, jobSkills),
            url: `https://www.google.com/search?q=${encodeURIComponent(q + ' jobs in ' + city + ' ' + portal)}`
          });
        }

        AppState.jobs.forEach(j => {
          let matches = 0;
          j.skills.forEach(js => {
            if(AppState.userSkills.some(us => js.toLowerCase().includes(us) || us.includes(js.toLowerCase()))) matches++;
          });
          j.matchScore = Math.max(35, Math.min(99, Math.round((matches / j.skills.length) * 100) + (Math.random()*15)));
        });

        renderFeed();
      }, 1000);
    }

    function renderFeed() {
      const feed = document.getElementById('jobFeed');
      document.getElementById('resultCount').innerText = AppState.jobs.length;
      feed.innerHTML = '';

      const sortMode = document.getElementById('sortJobs').value;
      AppState.jobs.sort((a,b) => sortMode === 'match' ? b.matchScore - a.matchScore : b.lpa - a.lpa);

      AppState.jobs.forEach((job, idx) => {
        const conf = PortalRegistry[job.portal];
        const isSelected = AppState.activeJob?.id === job.id;
        const color = job.matchScore > 75 ? 'text-green-400' : job.matchScore > 50 ? 'text-yellow-400' : 'text-orange-400';

        const div = document.createElement('div');
        div.className = `p-3 rounded-xl border transition-all cursor-pointer hover:bg-white/5 flex gap-3 ${isSelected && window.innerWidth >= 1024 ? 'bg-primary/10 border-primary shadow-[0_0_15px_rgba(249,115,22,0.2)]' : 'bg-slate-900/60 border-white/5'}`;
        
        div.innerHTML = `
          <div class="shrink-0 w-10 h-10 rounded-full border-2 border-white/10 flex items-center justify-center bg-slate-950 flex-col">
            <span class="text-[10px] font-black ${color}">${job.matchScore}%</span>
          </div>
          <div class="flex-1 min-w-0">
            <h4 class="font-bold text-white text-sm truncate">${job.title}</h4>
            <p class="text-[10px] text-slate-400 mt-0.5 truncate"><i class="fa-solid fa-building mr-1"></i>${job.company} &bull; ${job.location}</p>
            <div class="mt-2 flex items-center justify-between">
              <span class="text-[10px] font-bold text-secondary">${job.salaryStr}</span>
              <span class="text-[9px] px-1.5 py-0.5 rounded border ${conf.color} flex items-center gap-1"><i class="fa-brands ${conf.icon}"></i> ${job.portal}</span>
            </div>
          </div>
        `;
        div.onclick = () => {
          AppState.activeJob = job;
          if(window.innerWidth >= 1024) {
            renderFeed();
            renderInspector(document.getElementById('jobDetail'));
          } else {
            renderInspector(document.getElementById('mobileJobDetail'));
            document.getElementById('mobileOverlay').classList.remove('translate-y-full');
          }
        };
        feed.appendChild(div);
      });

      if(window.innerWidth >= 1024 && AppState.jobs.length > 0 && !AppState.activeJob) {
        AppState.activeJob = AppState.jobs[0];
        document.getElementById('jobDetailContainer').classList.remove('hidden');
        renderInspector(document.getElementById('jobDetail'));
      }
    }

    function renderInspector(container) {
      const job = AppState.activeJob;
      const conf = PortalRegistry[job.portal];
      
      container.innerHTML = `
        <div class="w-full flex flex-col text-left animate-fade-in relative z-10 pb-4">
          <div class="flex flex-col gap-2 mb-4">
            <div class="flex gap-2">
              <span class="px-2 py-1 rounded text-[10px] font-bold border ${conf.color} text-white flex items-center gap-1"><i class="fa-brands ${conf.icon}"></i> Scraped from ${job.portal}</span>
            </div>
            <h2 class="text-2xl font-black text-white leading-tight">${job.title}</h2>
            <p class="text-sm text-slate-400 font-medium"><i class="fa-solid fa-building mr-1"></i> ${job.company} &bull; <i class="fa-solid fa-location-dot mx-1"></i> ${job.location}</p>
          </div>

          <!-- INR Salary Benchmark -->
          <div class="bg-slate-900 border border-white/5 rounded-xl p-4 mb-4 shadow-inner">
            <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1">Estimated Indian Market Salary</p>
            <p class="text-xl font-bold text-secondary">${job.salaryStr}</p>
            <div class="mt-2 w-full h-1.5 bg-slate-950 rounded-full overflow-hidden flex relative">
              <div class="h-full bg-gradient-to-r from-orange-500 to-green-500 w-full"></div>
              <div class="absolute top-0 bottom-0 w-1 bg-white" style="left: ${Math.min(100, (job.lpa/45)*100)}%;"></div>
            </div>
            <div class="flex justify-between text-[8px] font-bold text-slate-600 mt-1 uppercase">
              <span>₹4 LPA (Fresher)</span><span>₹45+ LPA (Lead)</span>
            </div>
          </div>

          <!-- Full Description -->
          <div class="bg-slate-950/50 p-4 rounded-xl border border-white/5 mb-4">
            <h3 class="text-sm font-bold text-white border-b border-white/10 pb-2 mb-3">Extracted Job Description</h3>
            <p class="text-[13px] text-slate-300 leading-relaxed font-light">${job.desc}</p>
          </div>

          <a href="${job.url}" target="_blank" class="w-full bg-primary hover:bg-orange-500 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg text-sm mt-auto">
            Apply / View on ${job.portal} <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i>
          </a>
        </div>
      `;
    }

    window.onload = runGlobalSearch;
  </script>
</body>
</html>
